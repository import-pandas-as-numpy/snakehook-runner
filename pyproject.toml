[build-system]
requires = ["uv-build==0.12.1"]
build-backend = "uv_build"

[project]
name = "snakehook-runner"
version = "0.1.0"
description = "Public Python package triage sandbox runner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.140.0",
  "httpx2==2.9.1",
  "packaging==26.2",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
  "ty==0.0.63",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv-build]
module-root = "src"
