name: "snakehook-runner"
mode: ONCE
hostname: "snakehook"
cwd: "/work"
max_cpus: 1
keep_env: false
keep_caps: false
disable_no_new_privs: false

clone_newnet: true
clone_newuser: true
clone_newpid: true
clone_newns: true
clone_newuts: true
clone_newipc: true
clone_newcgroup: true

mount_proc: false
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  options: "size=67108864,nr_inodes=4096,mode=700"
  rw: true
  nosuid: true
  nodev: true
  noexec: true
}

user_net {
  enable: true
  tcp_ports: "none"
  udp_ports: "none"
  enable_dns: false
  enable_udp: false
  enable_icmp: false
  enable_ip6_dhcp: false
  enable_ip6_ra: false
}

use_cgroupv2: true
seccomp_policy_file: "/etc/nsjail.seccomp"
seccomp_log: true
