name: test-validate

on:
  workflow_call:
  pull_request:

permissions: {}

concurrency:
  group: test-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Strict validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # frozen: v9.0.0
        with:
          python-version: "3.11"
      - name: Install deps
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Test (mocked only)
        env:
          CI_MOCK_ONLY: "1"
        run: uv run pytest
      - name: Container build validation
        run: docker build -f container/Dockerfile .
