name: publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    uses: ./.github/workflows/test-validate.yml
    permissions:
      contents: read

  publish:
    name: Publish immutable image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      # Read repository contents for the image build context.
      contents: read
      # Publish the image and its attestations to GHCR.
      packages: write # zizmor: ignore[undocumented-permissions]
      # Request the GitHub OIDC identity used to sign the digest attestation.
      id-token: write # zizmor: ignore[undocumented-permissions]
      # Store the signed digest attestation with the repository.
      attestations: write # zizmor: ignore[undocumented-permissions]
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # frozen: v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # frozen: v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # frozen: v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # frozen: v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # frozen: v7.3.0
        id: build
        with:
          context: .
          file: container/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest published digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # frozen: v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Report immutable digest
        env:
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published image digest: ${PUBLISHED_DIGEST}"
          {
            echo "## Published Image"
            echo ""
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Digest: \`${PUBLISHED_DIGEST}\`"
            echo "- Canonical ref: \`${IMAGE_NAME}@${PUBLISHED_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
