version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    cooldown:
      default-days: 30
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
      python-production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
      python-development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    cooldown:
      default-days: 30
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-versions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    cooldown:
      default-days: 30
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-versions:
        applies-to: version-updates
        patterns:
          - "*"
